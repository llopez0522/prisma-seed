name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Los extremos del rango declarado en "engines": >=22.12.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # El binario publicado tiene que arrancar de verdad, no solo compilar.
      - run: node dist/cli.js --version

  integration:
    name: integracion (postgres + mysql + sqlite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: seeder_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prisma -d seeder_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: prisma
          MYSQL_DATABASE: seeder_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pprisma"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      POSTGRES_URL: postgresql://prisma:prisma@localhost:5432/seeder_test?schema=public
      MYSQL_URL: mysql://root:prisma@localhost:3306/seeder_test
      SQLITE_URL: file:/tmp/seeder_test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
